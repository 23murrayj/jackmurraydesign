<!--
  REMOVED FROM THE HOMEPAGE ABOUT SECTION - kept here so it is one paste to
  restore. Nothing else was deleted: the i18n key 'skills.marquee' is still
  in i18n.js in all four languages, and script.js still wires 'skillsTrack'
  (setupSeamlessMarquee + renderTickers), both guarded so they no-op while
  the markup is absent. Put the HTML back as the last child of
  <section class="about">, put the CSS back in styles.css, and it works again.

  WHY IT WAS REMOVED
  1. All nine of its tags are already on the about page, which lists 29
     skills in four labelled groups (DESIGN / RESEARCH / BUILD / TOOLS) -
     and the about page is exactly where this section's button sends you.
     Six matched a tag there word for word; the other three were synonyms
     (BRAND SYSTEMS/BRAND IDENTITY, MOTION/MOTION DESIGN, HTML / CSS/HTML+CSS).
  2. Six of the nine also appear in the hero marquee, so the homepage was
     running two scrolling strips of the same design words.
  3. It was costing the CTA its distinctiveness. The tags are the same visual
     object as the button - 2px border, uppercase, letterspaced, boxed - and
     sat 14px below it, which was the tightest gap in the whole section. The
     one thing the section exists to get clicked read as the first of ten
     identical buttons, and the tags had the motion.

  IF YOU RESTORE IT, give it real separation from the button (60px+) and
  consider dropping the border on the tags so they stop imitating it.
-->
